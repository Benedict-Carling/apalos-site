<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apalos LTD - Software Development Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            max-width: 600px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 3rem;
        }

        .cta {
            display: inline-block;
            background: #3b82f6;
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .cta:hover {
            background: #2563eb;
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .footer p {
            margin: 0.25rem 0;
        }

        .contact {
            color: #94a3b8;
            text-decoration: none;
        }

        .contact:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Apalos</h1>
        <p class="tagline">Software Development Services</p>

        <p class="description">
            We build high-quality software solutions tailored to your needs.
            From web applications to desktop software, we deliver clean,
            maintainable code that scales with your business.
        </p>

        <a href="mailto:ben@apalos.co.uk" class="cta">Get in Touch</a>

        <div class="footer">
            <p><a href="mailto:ben@apalos.co.uk" class="contact">ben@apalos.co.uk</a></p>
            <p>Apalos LTD</p>
            <p>Company No. 13644974</p>
        </div>
    </div>
</body>
</html>
