<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f4c81"/>
  <g transform="translate(256,256)">
    <!-- DNA double helix -->
    <path d="M-60,-140 C-60,-100 60,-80 60,-40 C60,0 -60,20 -60,60 C-60,100 60,120 60,160" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M60,-140 C60,-100 -60,-80 -60,-40 C-60,0 60,20 60,60 C60,100 -60,120 -60,160" stroke="rgba(255,255,255,0.5)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Rungs -->
    <line x1="-40" y1="-120" x2="40" y2="-120" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-55" y1="-60" x2="55" y2="-60" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-55" y1="60" x2="55" y2="60" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-40" y1="120" x2="40" y2="120" stroke="rgba(255,255,255,0.6)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
